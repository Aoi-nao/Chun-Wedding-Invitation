<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wedding Invitation</title>

    <meta name="description" content="Wedding Invitation">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=EB+Garamond:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="app">

        <section id="opening">

    <div class="opening-background"></div>

    <div class="opening-overlay"></div>

    <div class="opening-content">

        <p class="opening-title">
            WEDDING INVITATION
        </p>

        <h1 class="opening-name"></h1>

        <p class="opening-date"></p>

        <button
            id="openInvitation"
            class="opening-button">

            MỞ THIỆP

        </button>

    </div>

</section>

<div id="musicPlayer" class="music-player">

    <button
        id="musicToggle"
        class="music-button"
        aria-label="Music">

        <span class="music-icon music-off">♪</span>

        <span class="music-icon music-on">♫</span>

        <span class="music-wave wave"></span>


    </button>

</div>

        <section id="hero">

    <div class="hero-media">

        <img
            class="hero-photo-image"
            src=""
            alt="Ảnh cô dâu chú rể">

        <div class="hero-overlay"></div>

    </div>

    <div class="hero-wave">

        <svg
            viewBox="0 0 1440 120"
            preserveAspectRatio="none">

            <path
                fill="#ffffff"
                d="M0,68 Q720,112 1440,68 L1440,120 L0,120 Z">
            </path>

        </svg>

    </div>

    <div class="container">

        <div class="hero-content">

            <p class="hero-monogram"></p>

            <h1 class="hero-name"></h1>

            <p class="hero-date"></p>

            <p class="hero-quote"></p>

        </div>

    </div>

</section>

        <section id="invitation">

    <div class="container">

        <div class="invitation-content">

            <h2 class="invitation-title">
                Một ngày đặc biệt,<br>
                một khoảnh khắc đáng nhớ
            </h2>

            <div class="invitation-symbol">✦</div>

            <p class="invitation-message">
                Chúng tôi rất hạnh phúc khi được chia sẻ
                niềm vui này cùng bạn
            </p>

            <div class="invitation-symbol invitation-heart">♡</div>

            <p class="invitation-invite">
                Gia đình hai bên trân trọng kính mời
            </p>

        </div>

    </div>


            
</section>

        <section id="couple">

    <div class="couple-content">

        <div class="couple-heading">
            <h2>Hai trái tim,<br>một hành trình</h2>
        </div>

        <div class="couple-grid">

            <!-- CÔ DÂU -->
            <div class="couple-card couple-bride">

                <p class="couple-role">CÔ DÂU</p>

                <div class="couple-photo-wrap">
                    <img
                        class="couple-photo"
                        id="bride-avatar"
                        src=""
                        alt="Cô dâu"
                    >
                </div>

                <h3
                    class="couple-name"
                    id="bride-name"
                ></h3>

            </div>

            <!-- AMPERSAND -->
            <div class="couple-ampersand" aria-hidden="true">
                <span>&amp;</span>
            </div>

            <!-- CHÚ RỂ -->
            <div class="couple-card couple-groom">

                <p class="couple-role">CHÚ RỂ</p>

                <div class="couple-photo-wrap">
                    <img
                        class="couple-photo"
                        id="groom-avatar"
                        src=""
                        alt="Chú rể"
                    >
                </div>

                <h3
                    class="couple-name"
                    id="groom-name"
                ></h3>

            </div>

        </div>

    </div>
            <div class="couple-botanical couple-botanical-left" aria-hidden="true">
    <svg viewBox="0 0 180 100">
        <path
            d="M8 88 C42 72, 55 45, 92 32 C120 22, 145 18, 172 8"
            fill="none"
            stroke="currentColor"
            stroke-width="1"
        />

        <path d="M42 68 C34 57, 25 53, 16 54"
            fill="none"
            stroke="currentColor"
            stroke-width="1"
        />

        <path d="M58 53 C54 40, 46 34, 36 32"
            fill="none"
            stroke="currentColor"
            stroke-width="1"
        />

        <path d="M78 39 C76 28, 69 21, 60 17"
            fill="none"
            stroke="currentColor"
            stroke-width="1"
        />

        <path d="M101 30 C101 19, 96 12, 88 7"
            fill="none"
            stroke="currentColor"
            stroke-width="1"
        />

        <path d="M126 22 C130 13, 136 8, 145 5"
            fill="none"
            stroke="currentColor"
            stroke-width="1"
        />
    </svg>
</div>

<div class="couple-botanical couple-botanical-right" aria-hidden="true">
    <svg viewBox="0 0 180 100">
        <path
            d="M172 88 C138 72, 125 45, 88 32 C60 22, 35 18, 8 8"
            fill="none"
            stroke="currentColor"
            stroke-width="1"
        />

        <path d="M138 68 C146 57, 155 53, 164 54"
            fill="none"
            stroke="currentColor"
            stroke-width="1"
        />

        <path d="M122 53 C126 40, 134 34, 144 32"
            fill="none"
            stroke="currentColor"
            stroke-width="1"
        />

        <path d="M102 39 C104 28, 111 21, 120 17"
            fill="none"
            stroke="currentColor"
            stroke-width="1"
        />

        <path d="M79 30 C79 19, 84 12, 92 7"
            fill="none"
            stroke="currentColor"
            stroke-width="1"
        />

        <path d="M54 22 C50 13, 44 8, 35 5"
            fill="none"
            stroke="currentColor"
            stroke-width="1"
        />
    </svg>
</div>

</section>

        <section id="countdown"></section>

        <section id="ceremony"></section>

        <section id="gallery"></section>

        <section id="rsvp"></section>

        <section id="gift"></section>

        <section id="wishes"></section>

        <section id="footer"></section>

    </main>

    <!-- Data -->
    <script src="data/site-config.js"></script>
    <script src="data/theme-config.js"></script>
    <script src="data/wedding-data.js"></script>

    <!-- Main -->
    <script src="script.js"></script>

</body>

</html>
